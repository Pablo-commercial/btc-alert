name: BTC Alert

on:
  schedule:
    - cron: "7,37 * * * *"   # evita :00 y :30, los minutos mas saturados de GitHub
    - cron: "3 7 * * *"      # refuerzo 9:03 Espana (horario de verano)
    - cron: "3 8 * * *"      # refuerzo 9:03 Espana (horario de invierno)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: btc-alert
  cancel-in-progress: false

jobs:
  check-btc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar comprobacion
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python btc_alert.py

      - name: Guardar estado (si cambio)
        run: |
          if [ -n "$(git status --porcelain last_daily_alert.txt 2>/dev/null)" ]; then
            git config user.name "btc-alert-bot"
            git config user.email "actions@github.com"
            git add last_daily_alert.txt
            git commit -m "Actualiza fecha del ultimo resumen diario"
            git pull --rebase
            git push
          else
            echo "Sin cambios de estado, nada que commitear."
          fi
